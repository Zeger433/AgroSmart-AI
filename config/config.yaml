# AgroSmart AI — centralized configuration
# Paths are relative to the project root (agrosmart-ai/).

paths:
  data_raw: data/raw
  data_processed: data/processed
  artifacts_models: artifacts/models
  artifacts_reports: artifacts/reports

models:
  crop:
    # balanced_only: train_crop.py loads baseline CSV only (production model).
    # merged_smote: train_crop.py exits — run train_crop_experiment.py for Exp 2.
    training_mode: balanced_only
    artifact_path: artifacts/models/crop_model.pkl
    metadata_path: artifacts/models/crop_metadata.json
    experiment_metadata_path: artifacts/models/crop_metadata_experiment.json
    features:
      - N
      - P
      - K
      - temperature
      - humidity
      - ph
      - rainfall
      - soil_type
    classes:
      - rice
      - maize
      - chickpea
      - kidneybeans
      - pigeonpeas
      - mothbeans
      - mungbean
      - blackgram
      - lentil
      - pomegranate
      - banana
      - mango
      - grapes
      - watermelon
      - muskmelon
      - apple
      - orange
      - papaya
      - coconut
      - cotton
      - jute
      - coffee
  yield:
    artifact_path: artifacts/models/yield_model.pkl
    metadata_path: artifacts/models/yield_metadata.json
    features:
      - Area
      - Item
      - average_rain_fall_mm_per_year
      - pesticides_tonnes
      - avg_temp

training:
  random_state: 42
  test_size: 0.2
  cv_folds: 5
  rf_n_estimators: 100
  xgb_n_estimators: 100
  search_n_iter_rf: 6
  search_n_iter_xgb: 6
  svm_max_samples: 12000  # subsample for SVC speed on large merged crop data
  parallel_n_jobs: 2  # RandomizedSearchCV / cross_val_score (-1 = all cores)

validation:
  N: [0, 140]
  P: [5, 145]
  K: [5, 205]
  ph: [3.5, 9.0]
  temperature: [8, 43]
  humidity: [14, 100]
  rainfall: [20, 300]
  pesticides: [0, 1000000]

